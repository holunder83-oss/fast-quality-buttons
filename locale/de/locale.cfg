[mod-name]
fast-quality-buttons=Fast Quality Buttons

[mod-description]
fast-quality-buttons=5 Qualitäts-Knöpfe in der Schnellzugriffsleiste (ein-/ausblendbar über das "..."-Menü). Die gewählte Qualität gilt für Rezepte in Montagemaschinen und optional auch beim Bauen, für die Pipette und für Geister. Aktiven Knopf erneut klicken = aus.

[shortcut-name]
fqb=Qualität: __1__

[fqb]
quality-locked=__1__ ist noch nicht freigeschaltet

[mod-setting-name]
fqb-apply-recipes=Rezepte in Montagemaschinen
fqb-apply-build=Bauen aus dem Inventar
fqb-apply-pipette=Pipette (Q)
fqb-apply-ghosts=Geister

[mod-setting-description]
fqb-apply-recipes=Wählst du in einer Montagemaschine ein Rezept, wird es automatisch auf die gewählte Qualität gesetzt.
fqb-apply-build=Nimmst du ein baubares Item in die Hand, wird es gegen die gewählte Qualität aus deinem Inventar getauscht, falls vorhanden. Sonst bleibt das Item in der Hand.
fqb-apply-pipette=Mit der Pipette nimmst du die gewählte Qualität statt der Qualität des angeklickten Gebäudes, falls vorhanden.
fqb-apply-ghosts=Hast du das Item nicht (oder bist in der Fernansicht), platzierst du Geister in der gewählten Qualität. Die Bauroboter holen dann diese Qualität.
