[mod-name]
fast-quality-buttons=Fast Quality Buttons

[mod-description]
fast-quality-buttons=5 quality buttons in the shortcut bar (show/hide via its "..." menu). The selected quality applies to assembling machine recipes and optionally to building, the pipette and ghosts. Click the active button again to turn it off.

[shortcut-name]
fqb=Quality: __1__

[fqb]
quality-locked=__1__ is not unlocked yet

[mod-setting-name]
fqb-apply-recipes=Assembling machine recipes
fqb-apply-build=Building from inventory
fqb-apply-pipette=Pipette (Q)
fqb-apply-ghosts=Ghosts

[mod-setting-description]
fqb-apply-recipes=When you choose a recipe in an assembling machine, it is set to the selected quality.
fqb-apply-build=When you take a placeable item into your hand, it is swapped for the selected quality from your inventory if you have it. Otherwise the item stays in your hand.
fqb-apply-pipette=The pipette picks the selected quality instead of the quality of the clicked building, if you have it.
fqb-apply-ghosts=If you don't have the item (or are in remote view), ghosts are placed in the selected quality, so construction robots deliver that quality.
